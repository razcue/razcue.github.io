<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Astro changes everything">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#071233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="f-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#fff" opacity="0.06">
    <circle cx="80" cy="60" r="2" />
    <circle cx="200" cy="120" r="1.6" />
    <circle cx="980" cy="40" r="1.8" />
    <circle cx="640" cy="90" r="1.2" />
    <circle cx="1040" cy="180" r="1.4" />
    <circle cx="520" cy="10" r="1.0" />
  </g>

  <!-- Left headline -->
  <g transform="translate(96,100)">
    <text x="0" y="0" font-family="Inter, Roboto, sans-serif" font-size="42" fill="#e6f0ff" font-weight="700">Why </text>
    <g transform="translate(102,-35) scale(0.5)">
      <path d="M27.5893 91.1365C22.7555 86.7178 21.3443 77.4335 23.3583 70.7072C26.8503 74.948 31.6888 76.2914 36.7005 77.0497C44.4374 78.2199 52.0358 77.7822 59.2231 74.2459C60.0453 73.841 60.8052 73.3027 61.7036 72.7574C62.378 74.714 62.5535 76.6892 62.3179 78.6996C61.7452 83.5957 59.3086 87.3778 55.4332 90.2448C53.8835 91.3916 52.2437 92.4167 50.6432 93.4979C45.7262 96.8213 44.3959 100.718 46.2435 106.386C46.2874 106.525 46.3267 106.663 46.426 107C43.9155 105.876 42.0817 104.24 40.6844 102.089C39.2086 99.8193 38.5065 97.3081 38.4696 94.5909C38.4511 93.2686 38.4511 91.9345 38.2733 90.6309C37.8391 87.4527 36.3471 86.0297 33.5364 85.9478C30.6518 85.8636 28.37 87.6469 27.7649 90.4554C27.7187 90.6707 27.6517 90.8837 27.5847 91.1341L27.5893 91.1365Z" fill="#e6f0ff"/>
      <path d="M0 69.5866C0 69.5866 14.3139 62.6137 28.6678 62.6137L39.4901 29.1204C39.8953 27.5007 41.0783 26.3999 42.4139 26.3999C43.7495 26.3999 44.9325 27.5007 45.3377 29.1204L56.1601 62.6137C73.1601 62.6137 84.8278 69.5866 84.8278 69.5866C84.8278 69.5866 60.5145 3.35233 60.467 3.21944C59.7692 1.2612 58.5911 0 57.0029 0H27.8274C26.2392 0 25.1087 1.2612 24.3634 3.21944C24.3108 3.34983 0 69.5866 0 69.5866Z" fill="#e6f0ff"/>
    </g>
    <text x="148" y="0" font-family="Inter, Roboto, sans-serif" font-size="42" fill="#e6f0ff" font-weight="700">stro</text>
    <text x="0" y="68" font-family="Inter, Roboto, sans-serif" font-size="64" fill="white" font-weight="800">Changes Everything</text>
    <text x="0" y="138" font-family="Inter, Roboto, sans-serif" font-size="18" fill="#cfeafe" opacity="0.9">A lightweight, HTML-first web framework for fast sites</text>
  </g>

  <!-- Rocket + Astro mark on the right -->
  <g transform="translate(720,80)">
    <!-- Rocket body -->
    <g filter="url(#f-shadow)">
      <ellipse cx="200" cy="240" rx="88" ry="160" fill="url(#accent)" transform="rotate(-18 200 240)" />
      <!-- rocket nose -->
      <path d="M212 70 L260 170 L164 170 Z" fill="#fff" opacity="0.95" transform="translate(0,60) rotate(-18 212 140)" />
      <!-- fins -->
      <path d="M120 300 L80 350 L140 340 Z" fill="#fff" opacity="0.9" transform="rotate(-18 120 320)"/>
      <path d="M280 300 L240 350 L300 340 Z" fill="#fff" opacity="0.9" transform="rotate(-18 280 320)"/>
      <!-- window -->
      <circle cx="200" cy="215" r="26" fill="#0b1220" opacity="0.85" />
      <circle cx="200" cy="215" r="12" fill="#a7f3d0" opacity="0.9" />
    </g>

    <!-- Exhaust trail -->
    <g opacity="0.18" transform="translate(30,320)">
      <path d="M0 0 C 60 -40, 140 -60, 220 -80 C 300 -100, 360 -110, 420 -120" stroke="#06b6d4" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M0 10 C 60 -30, 140 -50, 220 -70 C 300 -90, 360 -100, 420 -110" stroke="#7c3aed" stroke-width="12" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Footer author text -->
  <text x="96" y="570" font-family="Inter, Roboto, sans-serif" font-size="20" fill="#9fbffb" opacity="0.85">Article by Rayko Azcue</text>
</svg>
